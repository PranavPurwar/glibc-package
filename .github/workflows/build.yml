name: Build gpkg

on:
  push:
    branches:
      - main
    paths:
      - 'gpkg/**'
  pull_request:
    paths:
      - 'gpkg/**'
  workflow_dispatch:

permissions: {}

jobs:
  build_and_upload:
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target_arch: aarch64
            runner: ubuntu-24.04-arm
          - target_arch: arm
            runner: ubuntu-24.04-arm
          - target_arch: x86_64
            runner: ubuntu-latest
      fail-fast: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: https://t3.storage.dev
      AWS_REGION: auto
      
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1000

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Get files from termux-packages repository
        run: ./get-build-package.sh

      - name: Gather build summary
        run: |
          TARGET_PKGS="glibc coreutils bash readline ncurses libarchive liblzma ca-certificates libgpg-error libidn2 libssh2 libnghttp2 libseccomp libsqlite libgcrypt libcurl linux-api-headers"

          mkdir -p ./artifacts ./pkgs
          touch ./pkgs/.placeholder

          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_COMMIT=$(jq --raw-output .pull_request.base.sha "$GITHUB_EVENT_PATH")
            OLD_COMMIT=$(jq --raw-output .commits[0].id "$GITHUB_EVENT_PATH")
            HEAD_COMMIT=$(jq --raw-output .commits[-1].id "$GITHUB_EVENT_PATH")
            if [ "$BASE_COMMIT" = "null" ]; then
              if [ "$OLD_COMMIT" = "$HEAD_COMMIT" ]; then
                CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "${HEAD_COMMIT}")
              else
                OLD_COMMIT="${OLD_COMMIT}~1"
                CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "${OLD_COMMIT}" "${HEAD_COMMIT}")
              fi
            else
              CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "${BASE_COMMIT}" "HEAD")
            fi

            if grep -qiP '^\s*%ci:no-build\s*$' <(git log --format="%B" -n 1 "HEAD"); then
              tar cf artifacts/pkgs-${{ matrix.target_arch }}.tar pkgs
              echo "[!] Force exiting as tag '%ci:no-build' was applied to HEAD commit message."
              exit 0
            fi

            if grep -qP '^scripts/(Dockerfile|properties\.sh|setup-android-sdk\.sh|setup-cgct\.sh|setup-ubuntu\.sh)$' <<< "$CHANGED_FILES"; then
              docker build -t ghcr.io/termux/package-builder-cgct:latest .
            fi

            for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
              repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
              while read -r file; do
                if ! [[ $file == ${repo_path}/* ]]; then continue; fi
                if [[ $file =~ ^${repo_path}/([.a-z0-9+-]*)/([.a-z0-9+-]*).subpackage.sh$ ]]; then
                  pkg=${BASH_REMATCH[1]}
                  subpkg=${BASH_REMATCH[2]}
                  if grep -qw "$pkg" <<< "$TARGET_PKGS" && [ ! -f "${repo_path}/${pkg}/${subpkg}.subpackage.sh" ]; then
                    echo "$subpkg" >> ./deleted_${repo}_packages.txt
                  fi
                elif [[ $file =~ ^${repo_path}/([.a-z0-9+-]*)/.*$ ]]; then
                  pkg=${BASH_REMATCH[1]}
                  if grep -qw "$pkg" <<< "$TARGET_PKGS"; then
                    if [ -d "${repo_path}/${pkg}" ]; then
                      echo "$pkg" >> ./built_${repo}_packages.txt
                      for subfile in $(find "${repo_path}/${pkg}/" -maxdepth 1 -type f -name \*.subpackage.sh | sort); do
                        echo "$(basename "${subfile%%.subpackage.sh}")" >> ./built_${repo}_subpackages.txt
                      done
                    else
                      echo "$pkg" >> ./deleted_${repo}_packages.txt
                    fi
                  fi
                fi
              done <<< "${CHANGED_FILES}"
            done
          else
            for pkg in $TARGET_PKGS; do
              for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
                repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
                if [ -d "${repo_path}/${pkg}" ]; then
                  echo "$pkg" >> ./built_${repo}_packages.txt
                  for subpkg in $(find "${repo_path}/${pkg}/" -maxdepth 1 -type f -name \*.subpackage.sh | sort); do
                    echo "$(basename "${subpkg%%.subpackage.sh}")" >> ./built_${repo}_subpackages.txt
                  done
                fi
              done
            done
          fi

          for repo in $(jq --raw-output 'del(.pkg_format) | .[].name' repo.json); do
            for f in packages subpackages; do
              file="./built_${repo}_${f}.txt"
              if [ -f "$file" ]; then awk '!seen[$0]++' "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"; fi
            done
            if [ -f ./deleted_${repo}_packages.txt ]; then
              awk '!seen[$0]++' ./deleted_${repo}_packages.txt > ./deleted_${repo}_packages.txt.tmp
              mv ./deleted_${repo}_packages.txt.tmp ./deleted_${repo}_packages.txt
            fi
          done

      - name: Build packages
        run: |
          declare -a packages
          for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
            repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
            if [ -f ./built_${repo}_packages.txt ]; then
              for pkg in $(cat ./built_${repo}_packages.txt); do
                packages="$packages ${repo_path}/${pkg}"
              done
            fi
          done

          if [ ! -z "$packages" ]; then
            # 1. Collect ALL package directories across all custom repos
            shopt -s nullglob
            ALL_DIRS=""
            for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
              if [ -d "$repo_path" ]; then
                ALL_DIRS="$ALL_DIRS $repo_path"/*
              fi
            done
            shopt -u nullglob
            
            # 2. Let buildorder.py resolve the full dependency graph across all known directories
            SORTED_ALL=$(./scripts/buildorder.py $ALL_DIRS)
            
            # 3. Filter the sorted graph to only keep the packages we actually need to build
            SORTED_PACKAGES=""
            for p in $SORTED_ALL; do
              for target in $packages; do
                if [ "$p" = "$target" ]; then
                  SORTED_PACKAGES="$SORTED_PACKAGES $p"
                  break
                fi
              done
            done
            packages="$SORTED_PACKAGES"
            echo "Optimized build order: $packages"

            # 4. Extract just the package names (strip the path) for the grep check
            pkg_names=$(for p in $packages; do basename "$p"; done | tr '\n' ' ')

            if grep -qP "(^|\s)${pkg_names// /($|\s)|(^|\s)}($|\s)" ./big-pkgs.list; then
              ./scripts/setup-ubuntu.sh
              ./scripts/setup-cgct.sh
              sudo apt install -y ninja-build
              # REMOVED -s: The perfect build order allows build-package.sh to extract dependencies from output/
              NDK=$ANDROID_NDK_LATEST_HOME ANDROID_HOME=$ANDROID_SDK_ROOT ./build-package.sh -I -f -a ${{ matrix.target_arch }} --format pacman --library glibc $packages
            else
              TERMUX_BUILDER_IMAGE_NAME="ghcr.io/termux/package-builder-cgct" ./scripts/run-docker.sh ./build-package.sh -I -f -a ${{ matrix.target_arch }} --format pacman --library glibc $packages
            fi
          fi

      - name: Generate build artifacts
        if: always()
        run: |
          for repo in $(jq --raw-output 'del(.pkg_format) | .[].name' repo.json); do
            test -f ./built_${repo}_packages.txt && mv ./built_${repo}_packages.txt ./pkgs/
            test -f ./built_${repo}_subpackages.txt && cat ./built_${repo}_subpackages.txt >> ./pkgs/built_${repo}_packages.txt \
              && rm ./built_${repo}_subpackages.txt
            test -f ./deleted_${repo}_packages.txt && mv ./deleted_${repo}_packages.txt ./pkgs/
          done

          if [ -d output ]; then
            find output -type f -name "*.pkg.*" -exec mv -t pkgs/ {} +
          fi
          
          find pkgs -type f -name "*.pkg.*" -exec sha256sum "{}" \; | sort -k2

          tar cf artifacts/pkgs-${{ matrix.target_arch }}-${{ github.sha }}.tar pkgs

      - name: Install pacman utilities (for Upload)
        if: github.event_name != 'pull_request'
        run: |
          sudo apt update
          sudo apt install -y pacman-package-manager jq libarchive-tools xz-utils python3

      - name: Upload packages and update repo index
        if: github.event_name != 'pull_request'
        run: |
          source ./scripts/utils/termux/package/termux_package.sh

          for repo in $(jq --raw-output 'del(.pkg_format) | .[].name' repo.json); do
            REPO_DIR="repo_${repo}_${{ matrix.target_arch }}"
            mkdir -p "$REPO_DIR"

            aws s3 cp "s3://${{ secrets.TIGRIS_BUCKET_NAME }}/${repo}/${{ matrix.target_arch }}/${repo}.db.tar.gz" "$REPO_DIR/${repo}.db.tar.gz" &
            aws s3 cp "s3://${{ secrets.TIGRIS_BUCKET_NAME }}/${repo}/${{ matrix.target_arch }}/${repo}.files.tar.gz" "$REPO_DIR/${repo}.files.tar.gz" &
            wait

            dp_file="deleted_${repo}_packages.txt"
            if [[ -f "pkgs/$dp_file" ]]; then
              path_dp_file="pkgs/${{ github.sha }}_${dp_file}"
              {
                for d_pkg in $(cat "pkgs/${dp_file}"); do
                  if ! termux_package__is_package_name_have_glibc_prefix "${d_pkg}"; then
                    termux_package__add_prefix_glibc_to_package_name "${d_pkg}"
                  else
                    echo "${d_pkg}"
                  fi
                done
              } > "${path_dp_file}"

              if [[ -f "$REPO_DIR/${repo}.db.tar.gz" ]]; then
                while read -r rm_pkg; do
                  repo-remove "$REPO_DIR/${repo}.db.tar.gz" "$rm_pkg" || true
                done < "${path_dp_file}"
              fi

              aws s3 cp "${path_dp_file}" "s3://${{ secrets.TIGRIS_BUCKET_NAME }}/${repo}/${{ matrix.target_arch }}/${path_dp_file##*/}" &
            fi

            db_updated=false
            shopt -s nullglob
            for list_pkg in pkgs/*.pkg.*; do
              PKG_BASENAME="${list_pkg##*/}"
              PKG_PATH="$REPO_DIR/$PKG_BASENAME"
              cp -f "$list_pkg" "$REPO_DIR/"

              if ! bsdtar -tf "$PKG_PATH" 2>/dev/null | grep -E '^(\./)?\.PKGINFO$' | grep -q '^\.PKGINFO$'; then
                EXTRACT_DIR=$(mktemp -d)
                bsdtar -xf "$PKG_PATH" -C "$EXTRACT_DIR"

                if [ ! -f "$EXTRACT_DIR/.PKGINFO" ]; then
                  RAW_NAME=$(basename "$PKG_BASENAME" .pkg.tar.xz)
                  RAW_NAME=$(basename "$RAW_NAME" .pkg.tar.zst)
                  PKG_ARCH="${RAW_NAME##*-}"
                  REM="${RAW_NAME%-*}"
                  PKG_REL="${REM##*-}"
                  REM="${REM%-*}"
                  PKG_VER="${REM##*-}"
                  PKG_NAME="${REM%-*}"

                  printf "pkgname = %s\npkgver = %s-%s\npkgdesc = %s package\narch = %s\nsize = %s\nbuilddate = %s\npackager = GitHubActions\n" \
                    "$PKG_NAME" "$PKG_VER" "$PKG_REL" "$PKG_NAME" "$PKG_ARCH" "$(stat -c%s "$PKG_PATH")" "$(date +%s)" > "$EXTRACT_DIR/.PKGINFO"
                fi

                ( cd "$EXTRACT_DIR" && bsdtar -cf - * .PKGINFO 2>/dev/null || bsdtar -cf - * ) | xz -c > "$PKG_PATH"
                rm -rf "$EXTRACT_DIR"
              fi

              aws s3 cp "$PKG_PATH" "s3://${{ secrets.TIGRIS_BUCKET_NAME }}/${repo}/${{ matrix.target_arch }}/$PKG_BASENAME" &
              repo-add -R "$REPO_DIR/${repo}.db.tar.gz" "$PKG_PATH"
              db_updated=true
            done
            wait # Wait for all S3 package uploads
            shopt -u nullglob

            if [[ "$db_updated" = true ]] || [[ -f "pkgs/$dp_file" && -f "$REPO_DIR/${repo}.db.tar.gz" ]]; then
              python3 -c 'import sys, textwrap; code = sys.argv.pop(1); exec(textwrap.dedent(code))' '
              import os, sys, tarfile, json
              repo_dir, repo = sys.argv[1], sys.argv[2]
              db_path = os.path.join(repo_dir, f"{repo}.db.tar.gz")
              out_json = os.path.join(repo_dir, f"{repo}.json")
              repo_data = {}
              if os.path.exists(db_path):
                  with tarfile.open(db_path, "r:gz") as tar:
                      for m in tar.getmembers():
                          if m.name.endswith("/desc"):
                              f = tar.extractfile(m)
                              if not f:
                                  continue
                              content = f.read().decode("utf-8", "ignore").splitlines()
                              pkg, key = {}, None
                              for line in content:
                                  line = line.strip()
                                  if line.startswith("%") and line.endswith("%"):
                                      key = line[1:-1]
                                      pkg[key] = []
                                  elif line and key:
                                      pkg[key].append(line)
                              name = pkg.get("NAME", [""])[0]
                              if name:
                                  repo_data[name] = {k: (v[0] if len(v) == 1 else v) for k, v in pkg.items() if k != "NAME"}
              with open(out_json, "w", encoding="utf-8") as jf:
                  json.dump(repo_data, jf, indent=2)
              ' "$REPO_DIR" "${repo}"

              aws s3 cp "$REPO_DIR/${repo}.db.tar.gz" "s3://${{ secrets.TIGRIS_BUCKET_NAME }}/${repo}/${{ matrix.target_arch }}/${repo}.db.tar.gz" &
              aws s3 cp "$REPO_DIR/${repo}.files.tar.gz" "s3://${{ secrets.TIGRIS_BUCKET_NAME }}/${repo}/${{ matrix.target_arch }}/${repo}.files.tar.gz" &
              aws s3 cp "$REPO_DIR/${repo}.db.tar.gz" "s3://${{ secrets.TIGRIS_BUCKET_NAME }}/${repo}/${{ matrix.target_arch }}/${repo}.db" &
              aws s3 cp "$REPO_DIR/${repo}.files.tar.gz" "s3://${{ secrets.TIGRIS_BUCKET_NAME }}/${repo}/${{ matrix.target_arch }}/${repo}.files" &
              aws s3 cp "$REPO_DIR/${repo}.json" "s3://${{ secrets.TIGRIS_BUCKET_NAME }}/${repo}/${{ matrix.target_arch }}/${repo}.json" &
              wait

              rm -f "$REPO_DIR/${repo}.db" "$REPO_DIR/${repo}.files"
              cp "$REPO_DIR/${repo}.db.tar.gz" "$REPO_DIR/${repo}.db"
              cp "$REPO_DIR/${repo}.files.tar.gz" "$REPO_DIR/${repo}.files"
            fi

            mkdir -p "dist/${repo}/${{ matrix.target_arch }}"
            if [ -d "$REPO_DIR" ]; then
              cp -rf "$REPO_DIR"/* "dist/${repo}/${{ matrix.target_arch }}/"
            fi
          done

      - name: Store final gpkg directory and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpkg-${{ matrix.target_arch }}-${{ github.sha }}
          path: |
            ./artifacts
            dist/
